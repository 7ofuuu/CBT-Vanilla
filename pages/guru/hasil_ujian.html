<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/guru/hasil_ujian.css" />
  <link rel="stylesheet" href="../../assets/css/guru/style.css">
  <title>Hasil Ujian</title>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo">
        <img src="../../assets/logo-sekolah.png" alt="Logo Sekolah" />
      </div>
      <h1>SMAN 1 Parigi</h1>
    </div>
    <div class="header-right">
      <div class="user-info">
        <div class="user-text">
          <span class="user-name">Naafiri</span>
          <span class="user-role">Guru</span>
        </div>
        <div class="user-avatar">
          <img src="../../assets/profile-admin.png" alt="User Avatar" />
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <nav class="sidebar">
      <div class="menu-title">Menu</div>
      <ul class="menu-list">
        <a href="home-guru.html">
            <li class="menu-item">
            <img src="../../assets/icon/logo-home.png" width="24" height="24">
            <span>Beranda</span>
          </li>
          </a>
          <a href="banksoal.html">
             <li class="menu-item">
            <img src="../../assets/icon/logo-banksoal.png" width="24" height="24">
            <span>Bank Soal</span>
          </li>
          </a>
          <a href="jadwal-ujian.html">
             <li class="menu-item active">
            <img src="../../assets/icon/logo-jadwalujian.png" width="24" height="24">
            <span>Jadwal Ujian</span>
          </li>
          </a>
          <a href="hasil_ujian.html">
            <li class="menu-item">
            <img src="../../assets/icon/logo-hasilujian.png" width="24" height="24">
            <span>Hasil Ujian</span>
          </li>
          </a>
      </ul>
      <button class="logout-btn" id="logoutBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </nav>

    <section class="main-content">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <h2 class="content-title">Hasil Ujian</h2>
        <div>
          <button id="addExamBtn" class="btn-primary" style="padding:8px 12px;border-radius:6px">Tambah Ujian</button>
        </div>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Cari Ujian" />
        <button id="searchBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <div class="exam-grid" id="examGrid" data-init="true">
      </div>
    </section>
  </main>

  <script src="../../js/hasil_ujian.js"></script>
</body>
</html>
