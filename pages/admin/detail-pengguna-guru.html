<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Pengguna | Guru</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/admin/detail-pengguna-guru.css" />
    <script src="../../js/admin/ilham.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-left">
        <div class="logo">
          <img src="../../assets/logo-sekolah.png" alt="" />
        </div>
        <h1>SMAN 1 Parigi</h1>
      </div>
      <div class="header-right">
        <div class="user-info">
          <div class="user-text">
            <span id="username" class="user-name">Braum Chad</span>
            <span id="user-role" class="user-role"></span>
          </div>
          <div class="user-avatar">
            <img src="../../assets/profile-admin.png" alt="User Avatar" />
          </div>
        </div>
      </div>
    </header>

    <main>
      <nav class="sidebar">
        <div class="menu-title">Menu</div>
        <ul class="menu-list">
          <li class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
            <a href="home-admin.html">Beranda</a>
          </li>
          <li class="menu-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <a href="semua-pengguna.html">Pengguna</a>
          </li>
          <li class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <a href="daftar-kelas.html">Kelas</a>
          </li>
          <li class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <a href="aktivitas.html">Aktivitas</a>
          </li>
        </ul>
        <button class="logout-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </nav>

      <div class="content">
        <div class="breadcrumb">
          <a href="semua-pengguna.html" class="breadcrumb-link">Daftar Pengguna</a>
          <span class="breadcrumb-separator">></span>
          <span class="breadcrumb-current">Detail Pengguna</span>
        </div>

        <div class="detail-card">
          <div class="user-header">
            <div class="user-profile">
              <img src="../../assets/profile-admin.png" alt="Sumbul" class="user-photo" />
              <div class="user-info-detail">
                <h2 class="user-fullname">Sumbul</h2>
                <p class="user-role-label">guru</p>
              </div>
            </div>
            <span class="role-badge">Guru</span>
          </div>

          <form class="detail-form">
            <div class="form-row">
              <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" value="Muhammad Sumbul" />
              </div>
              <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username-field" name="username" value="Sumbul" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="password">Password</label>
                <input type="text" id="password" name="password" value="ireadquranalot" />
              </div>
              <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role">
                  <option value="guru" selected>Guru</option>
                  <option value="admin">Admin</option>
                  <option value="siswa">Siswa</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn-delete">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Hapus Pengguna
              </button>
              <button type="button" class="btn-save">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                  <polyline points="17 21 17 13 7 13 7 21"></polyline>
                  <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                Simpan Perubahan
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
