<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aktivitas Peserta</title>

    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/admin/aktivitas.css" />
</head>

<body>
    <header>
        <div class="header-left">
            <div class="logo"><img src="../../assets/logo-sekolah.png" alt="Logo" /></div>
            <h1>SMAN 1 Parigi</h1>
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-text">
                    <span class="user-name">Braum Chad</span>
                    <span class="user-role">admin</span>
                </div>
                <div class="user-avatar">
                    <img src="../../assets/profile-admin.png" alt="Admin" />
                </div>
            </div>
        </div>
    </header>

    <main>
        <nav class="sidebar">
            <div class="menu-title">Menu</div>
            <ul class="menu-list">
                <li class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    <span>Beranda</span>
                </li>
                <li class="menu-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Pengguna</span>
                </li>
                <li class="menu-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Aktivitas</span>
                </li>
            </ul>

            <button class="logout-btn" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
            </button>
        </nav>

        <div class="container">
            <h2 class="page-title">
                <a href="./aktivitas.html" class="breadcrumb-back">Aktivitas</a> ›
                <span>Peserta</span>
            </h2>

            <div class="search-row">
                <div class="searchbar">
                    <input id="search-aktivitas" type="text"
                        placeholder="Cari peserta berdasarkan nama, kelas, atau status..." />
                    <button type="button" class="search-btn" aria-label="Cari">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <circle cx="11" cy="11" r="6" stroke="#9aa3ad" stroke-width="2"></circle>
                            <path d="M21 21l-4.35-4.35" stroke="#9aa3ad" stroke-width="2" stroke-linecap="round"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="filters-row">
                <div class="filter">
                    <select>
                        <option value="">Semua Tingkat</option>
                    </select>
                </div>
                <div class="filter">
                    <select>
                        <option value="">Semua Kelas</option>
                    </select>
                </div>
                <div class="filter">
                    <select>
                        <option value="">Semua Status</option>
                    </select>
                </div>
            </div>

            <div class="activity-detail-table">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Tingkat</th>
                            <th>Kelas</th>
                            <th>Mata Pelajaran</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>


            <div class="pagination">
                <span>&lt; 1 dari 10 &gt;</span>
            </div>
        </div>
    </main>

    <script src="../../js/admin/aktivitas.js"></script>
</body>

</html>
