<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aktivitas</title>

    <link rel="stylesheet" href="../../css/global.css" />

  <body>
    <header>

        <div class="logo"><img src="../../assets/logo-sekolah.png" alt="Logo" /></div>
        <h1>SMAN 1 Parigi</h1>
      </div>
      <div class="header-right">
        <div class="user-info">
          <div class="user-text">
            <span class="user-name">Braum Chad</span>
            <span class="user-role">admin</span>

          <div class="user-avatar">

      </div>

    <main>
      <nav class="sidebar">
        <div class="menu-title">Menu</div>
        <ul class="menu-list">
          <li class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
            <span>Beranda</span>
          </li>
          <li class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Pengguna</span>
          </li>
          <li class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <a href="daftar-kelas.html">Kelas</a>
          </li>
          <li class="menu-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>Aktivitas</span>
          </li>
        </ul>

        <button class="logout-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </nav>

      <div class="container">
        <h2 class="page-title">
          <span>Aktivitas</span>
        </h2>

        <div class="filters-row">
          <div class="filter">
            <select>
              <option>Semua Jenis Ujian</option>
            </select>
          </div>
          <div class="filter">
            <select>
              <option>Semua Jurusan</option>
            </select>
          </div>
          <div class="filter">
            <select>
              <option>Semua Kelas</option>
            </select>
          </div>
          <div class="filter">
            <select>
              <option>Semua Mapel</option>
            </select>
          </div>
          <div class="filter">
            <select>
              <option>Status</option>
            </select>
          </div>
        </div>

        <div class="cards-grid"></div>

        <div class="pagination">
          <span>&lt; 1 dari 10 &gt;</span>
        </div>

    <script src="../../js/admin/aktivitas.js"></script>
