<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Aktivitas</title>

  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/admin/aktivitas.css" />
</head>

<body>
  <header>
    <div class="header-left">
      <div class="logo"><img src="../../assets/logo-sekolah.png" alt="Logo" /></div>
      <h1>SMAN 1 Parigi</h1>
    </div>
    <div class="header-right">
      <div class="user-info">
        <div class="user-text">
          <span class="user-name">Braum Chad</span>
          <span class="user-role">admin</span>
        </div>
        <div class="user-avatar">
          <img src="../../assets/profile-admin.png" alt="Admin" />
        </div>
      </div>
    </div>
  </header>

  <main>
    <nav class="sidebar">
      <div class="menu-title">Menu</div>
      <ul class="menu-list">
        <li class="menu-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          <span>Beranda</span>
        </li>
        <li class="menu-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Pengguna</span>
        </li>
        <li class="menu-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Aktivitas</span>
        </li>
      </ul>

      <button class="logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </nav>

    <div class="container">
      <h2 class="page-title">
        <a href="aktivitas.html" class="breadcrumb-back">Aktivitas</a> ›
        <span>Detail Aktivitas</span>
      </h2>

      <div class="detail-container">
        <div class="user-detail">
          <img src="../../assets/profile-admin.png" alt="Foto Siswa" class="user-photo" />
          <div class="user-info">
            <h2>Vergil Sparda</h2>
            <p>XII IPA 01</p>
            <div class="status">
              Status: <span class="status-badge blocked">Blocked</span>
            </div>
          </div>
        </div>

        <div class="violation-section">
          <h3>Keterangan Pelanggaran</h3>
          <div class="violation-box">
            <p>Keluar dari aplikasi sebelum ujian selesai.</p>
          </div>
        </div>

        <div class="code-section">
          <h3>Kode Pemulihan</h3>
          <div class="code-container">
            <input type="text" id="recoveryCode" value="ex: u8Bp9" readonly />
            <button class="generate-btn" type="button">Generate Code</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../../js/admin/aktivitas.js"></script>
</body>
</html>
