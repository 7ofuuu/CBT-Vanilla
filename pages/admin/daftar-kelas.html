<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Kelas</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/admin/daftar-kelas.css" />
    <script src="../../js/admin/kelas.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-left">
        <div class="logo">
          <img src="../../assets/logo-sekolah.png" alt="" />
        </div>
        <h1>SMAN 1 Parigi</h1>
      </div>
      <div class="header-right">
        <div class="user-info">
          <div class="user-text">
            <span id="username" class="user-name">Braum Chad</span>
            <span id="user-role" class="user-role"></span>
          </div>
          <div class="user-avatar">
            <img src="../../assets/profile-admin.png" alt="User Avatar" />
          </div>
        </div>
      </div>
    </header>

    <main>
      <nav class="sidebar">
        <div class="menu-title">Menu</div>
        <ul class="menu-list">
          <li class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
            <a href="home-admin.html">Beranda</a>
          </li>
          <li class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <a href="semua-pengguna.html">Pengguna</a>
          </li>
          <li class="menu-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <a href="daftar-kelas.html">Kelas</a>
          </li>
          <li class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <a href="aktivitas.html">Aktivitas</a>
          </li>
        </ul>
        <button class="logout-btn" onclick="logout()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </nav>

      <div class="content">
        <div class="page-header">
          <h2 class="page-title">Daftar Kelas</h2>
          <button class="btn-add" onclick="showTambahKelasModal()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="8" stroke="white" stroke-width="2" />
              <path d="M10 6V14M6 10H14" stroke="white" stroke-width="2" stroke-linecap="round" />
            </svg>
            Tambah Kelas
          </button>
        </div>

        <div class="controls">
          <input type="text" class="search-input" placeholder="Cari Kelas" id="searchInput" />
          <div class="filters">
            <select class="filter-select" id="filterJurusan">
              <option value="">Semua Jurusan</option>
              <option value="IPA">IPA</option>
              <option value="IPS">IPS</option>
            </select>
            <select class="filter-select" id="filterTingkat">
              <option value="">Semua Tingkat</option>
              <option value="X">Tingkat X</option>
              <option value="XI">Tingkat XI</option>
              <option value="XII">Tingkat XII</option>
            </select>
          </div>
        </div>

        <div class="kelas-grid" id="kelasGrid">
          <!-- Kelas cards will be populated by JavaScript -->
        </div>
      </div>
    </main>

    <!-- Modal Tambah Kelas -->
    <div id="modalTambahKelas" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Tambah Kelas Baru</h3>
          <button class="close-btn" onclick="closeTambahKelasModal()">&times;</button>
        </div>
        <form id="formTambahKelas" class="modal-form">
          <div class="form-group">
            <label for="namaKelas">Nama Kelas *</label>
            <input type="text" id="namaKelas" name="namaKelas" placeholder="Contoh: XII IPA 1" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="jurusan">Jurusan *</label>
              <select id="jurusan" name="jurusan" required>
                <option value="">Pilih Jurusan</option>
                <option value="IPA">IPA</option>
                <option value="IPS">IPS</option>
              </select>
            </div>
            <div class="form-group">
              <label for="tingkat">Tingkat *</label>
              <select id="tingkat" name="tingkat" required>
                <option value="">Pilih Tingkat</option>
                <option value="X">X</option>
                <option value="XI">XI</option>
                <option value="XII">XII</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="waliKelas">Wali Kelas</label>
            <input type="text" id="waliKelas" name="waliKelas" placeholder="Nama Wali Kelas" />
          </div>

          <div class="form-group">
            <label for="jumlahSiswa">Jumlah Siswa</label>
            <input type="number" id="jumlahSiswa" name="jumlahSiswa" placeholder="0" min="0" />
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" onclick="closeTambahKelasModal()">Batal</button>
            <button type="submit" class="btn-submit">Tambah Kelas</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
